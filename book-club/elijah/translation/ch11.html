<script>
(function () {
  'use strict';
  var P = JSON.parse(document.getElementById('payload').textContent);
  var locked = document.getElementById('locked');
  var content = document.getElementById('content');
  var pw = document.getElementById('pw');
  var go = document.getElementById('go');
  var msg = document.getElementById('msg');

  function bytes(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function load() { try { var v = JSON.parse(localStorage.getItem(P.store) || 'null'); return v && v.salt === P.salt ? v.key : null; } catch (e) { return null; } }
  function save(key) { try { localStorage.setItem(P.store, JSON.stringify({ salt: P.salt, key: key })); } catch (e) {} }
  function forget() { try { localStorage.removeItem(P.store); } catch (e) {} }

  function open(raw) {
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, k, bytes(P.data)); })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function derive(password) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, 256); });
  }
  function show(page) {
    document.title = page.title;
    content.innerHTML = page.html;
    locked.hidden = true;
    var btn = content.querySelector('[data-lock]');
    if (btn) btn.addEventListener('click', function () { forget(); location.reload(); });
  }
  function unlock() {
    var value = pw.value.normalize('NFC').trim();
    if (!value) { pw.focus(); return; }
    go.disabled = true;
    msg.textContent = '解鎖中……';
    var raw;
    derive(value)
      .then(function (r) { raw = r; return open(r); })
      .then(function (page) { save(b64(raw)); show(page); })
      .catch(function () { msg.textContent = '密碼不對，請再試一次。'; go.disabled = false; pw.select(); });
  }

  if (!window.crypto || !crypto.subtle || !window.TextEncoder) {
    msg.textContent = '這個瀏覽器無法開啟這一頁，請改用新版的瀏覽器。';
    go.disabled = true;
    return;
  }
  go.addEventListener('click', unlock);
  pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });
  var key = load();
  if (key) open(bytes(key)).then(show).catch(function () { forget(); pw.focus(); });
  else pw.focus();
})();
</script>
